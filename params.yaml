seed: 42
data:
  processed_dir: data/processed
  splits:
  - train
  - val
  - test
  healthy_label: healthy
  disease_classes:
  - miner
  - rust
  - phoma
  segmentation:
    source_name: BRACOT
    source_url: https://data.mendeley.com/datasets/pmkbyjpf6k/1
    raw_dir: data/raw/segmentation/bracot
    annotation_format: via
    # Leave empty to auto-discover VIA JSON files anywhere below raw_dir.
    annotations_file: ''
    # Optional CSV with image,split,group_id. Without it, split is deterministic.
    manifest_file: ''
    split_ratios:
      train: 0.70
      val: 0.15
      test: 0.15
  classification:
    source_name: Coffee leaf diseases (Kaggle)
    source_url: 
      https://www.kaggle.com/datasets/badasstechie/coffee-leaf-diseases
    raw_dir: data/raw/classification/coffee-leaf-diseases
    train_labels_file: train_classes.csv
    test_labels_file: test_classes.csv
    mask_colors_file: mask_colors.csv
    id_column: id
    images_dir: images
    masks_dir: masks
    # Kaggle supplies train/test. Keep test untouched and derive val from train,
    # stratified by the complete multi-label signature.
    validation_fraction: 0.15
  # Shared by Kaggle mask preprocessing and segmenter crops at inference.
  mask_background: true
  mask_fill_rgb:
  - 124
  - 116
  - 104
  crop_padding_ratio: 0.05
  min_crop_size: 32
segmentation:
  candidates:
    yolo11n_seg: yolo11n-seg.pt
    yolo11s_seg: yolo11s-seg.pt
  image_size: 640
  epochs: 100
  batch_size: 4
  patience: 20
  workers: 0
  device: auto
  pretrained: true
  deterministic: true
classification:
  candidates:
    efficientnet_v2_s:
      architecture: efficientnet_v2_s
      image_size: 300
      dropout: 0.4
      unfreeze_blocks: 3
    regnet_y_3_2gf:
      architecture: regnet_y_3_2gf
      image_size: 224
      dropout: 0.3
      unfreeze_blocks: 1
  epochs: 20
  batch_size: 8
  workers: 0
  pretrained: true
  backbone_lr: 1.0e-05
  head_lr: 0.001
  weight_decay: 0.01
  label_smoothing: 0.05
  patience: 6
selection:
  # Stable, validation-only score used between runs for champion/challenger.
  deployment_weights:
    segmenter_map50_95: 0.35
    segmenter_recall: 0.15
    classifier_macro_f1: 0.35
    classifier_min_class_recall: 0.15
  segmentation:
    min_map50_95: 0.45
    min_recall: 0.65
    weights:
      map50_95: 0.70
      recall: 0.2
      latency: 0.07
      size: 0.03
  classification:
    min_macro_f1: 0.85
    min_class_recall: 0.7
    weights:
      macro_f1: 0.70
      min_class_recall: 0.2
      latency: 0.07
      size: 0.03
deployment:
  detector_confidence: 0.25
  classifier_confidence: 0.5
  image_size: 640
  export_onnx: false
  onnx_opset: 17
dagshub:
  enabled: true
  repo_owner: Anh467
  repo_name: CoffeeLeaf-AI
  experiment_name: coffee-leaf-training
  registered_model_name: CoffeeLeaf-AI-Pipeline
  promotion:
    min_score_improvement: 0.005
    allow_first_model: true
    allow_evaluation_change: false
    required_git_branch: main

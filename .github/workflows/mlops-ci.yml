name: MLOps CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mlops.txt

      - name: Install fast validation dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Compile Python files
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

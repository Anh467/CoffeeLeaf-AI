artifacts:
  coffee-leaf-segmenter:
    path: deployment/leaf_segmenter.pt
    type: model
    desc: Class-agnostic instance segmentation model for leaves in whole-tree images.
    labels: [pytorch, ultralytics, segmentation]
  coffee-disease-classifier:
    path: deployment/leaf_classifier.pt
    type: model
    desc: Disease classifier applied to masked leaf instances.
    labels: [pytorch, torchvision, classification]

stages:
  prepare:
    cmd: python pipeline.py prepare
    deps:
      - pipeline.py
      - data/raw/segmentation
      - data/raw/classification
    params:
      - seed
      - data
    outs:
      - data/processed
    metrics:
      - metrics/data.json:
          cache: false

  train_segmenters:
    cmd: >-
      papermill notebooks/train_leaf_segmentation.ipynb
      notebooks/train_leaf_segmentation.executed.ipynb
      --cwd . -p params_path params.yaml
    deps:
      - pipeline.py
      - notebooks/train_leaf_segmentation.ipynb
      - data/processed/segmentation
    params:
      - seed
      - segmentation
    outs:
      - models/segmenters
    metrics:
      - metrics/segmenters.json:
          cache: false
    plots:
      - metrics/segmenters.csv:
          cache: false
          x: candidate
          y: map50_95

  train_classifiers:
    cmd: >-
      papermill notebooks/train_disease_classification.ipynb
      notebooks/train_disease_classification.executed.ipynb
      --cwd . -p params_path params.yaml
    deps:
      - pipeline.py
      - notebooks/train_disease_classification.ipynb
      - data/processed/classification
    params:
      - seed
      - classification
      - data.disease_classes
      - data.healthy_label
      - data.mask_background
      - data.mask_fill_rgb
      - deployment.classifier_confidence
    outs:
      - models/classifiers
    metrics:
      - metrics/classifiers.json:
          cache: false
      - metrics/classification_eda.json:
          cache: false
    plots:
      - metrics/classifiers.csv:
          cache: false
          x: candidate
          y: macro_f1
      - metrics/classification_eda.png:
          cache: false
      - metrics/classifier_training_curves.png:
          cache: false
      - metrics/classifier_comparison.png:
          cache: false
      - metrics/classifier_confusion_matrices.png:
          cache: false

  select:
    cmd: python pipeline.py select
    deps:
      - pipeline.py
      - models/segmenters
      - models/classifiers
      - metrics/segmenters.json
      - metrics/classifiers.json
      - data/processed/dataset_manifest.json
    params:
      - data.disease_classes
      - data.healthy_label
      - classification.candidates
      - selection
      - deployment
    outs:
      - deployment
    metrics:
      - metrics/selection.json:
          cache: false
    plots:
      - metrics/leaderboard.csv:
          cache: false
          x: candidate
          y: score

  publish:
    cmd: python pipeline.py publish
    # Re-check external Registry state/branch even when the bundle is unchanged.
    always_changed: true
    deps:
      - pipeline.py
      - deployment
      - metrics/data.json
      - metrics/classification_eda.json
      - metrics/classification_eda.png
      - metrics/classifier_training_curves.png
      - metrics/classifier_comparison.png
      - metrics/classifier_confusion_matrices.png
      - metrics/segmenters.json
      - metrics/classifiers.json
      - metrics/classifiers.csv
      - metrics/selection.json
    params:
      - dagshub
    metrics:
      - metrics/publish.json:
          cache: false

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/dashboard.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom app-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-semibold" href="/">Coffee Leaf Disease Dashboard</a>
      <div class="d-flex gap-3 align-items-center">
        <a class="nav-link" href="/">Predict</a>
        <a class="nav-link" href="/history-page">History</a>
        <a class="nav-link" href="/docs">API</a>
        {% if health and health.models_loaded %}
        <span class="badge text-bg-success">Models ready</span>
        {% else %}
        <span class="badge text-bg-warning">Models missing</span>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
